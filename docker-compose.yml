services:
  postgres:
    image: postgres:16-alpine
    container_name: myp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myp_password}
      POSTGRES_DB: ${POSTGRES_DB:-myp_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myp_user} -d ${POSTGRES_DB:-myp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - myp_network

  redis:
    image: redis:7-alpine
    container_name: myp_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - myp_network

